<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="career counselling chatbot, career guidance bot, chatbot for counselling, AI counselling assistant, engineering chatbot">
    <title>Chatbot</title>
    <!-- Link to CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
     <!-- Sidebar Toggle Button -->
    <button id="toggle-sidebar">☰</button>

    <!-- Sidebar -->
    <div id="sidebar">
        <button id="close-btn">×</button>

        <!-- User Profile -->
        <div id="user-profile">
            <div id="profile-icon">U</div>
            <h3 id="username">User Name</h3>
        </div>

        <!-- Search History -->
        <h4>Search History (Last 7 Days)</h4>
        <ul id="history-list"></ul>
        <!-- Logout Button -->
        <button id="logout-btn">Logout</button>

    </div>
    
    <div class="chat-container">
        <div id="chatbox">
            <div id="chat-log"></div>
        </div>
        <input type="text" id="userInput" placeholder="Type your message here...">
        <button id="sendButton">Send</button>
        <button id="voiceInputButton">🎤 voice</button> <!-- Voice Input -->
        <button id="voiceOutputButton">🔊 Read</button> <!-- Voice Output -->
    </div>

    <!-- Link to JavaScript -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
